<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Hi, I am Umang - Software Developer">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#3a4a40" fill-opacity="0.45"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9f36a" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#c9f36a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ef7157" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="28" fill="#0c1410"/>
  <rect width="1200" height="480" rx="28" fill="url(#dots)"/>
  <circle cx="1040" cy="360" r="160" fill="url(#glow)" filter="url(#soft)"/>

  <g transform="translate(72 56)">
    <text x="0" y="30" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="700" letter-spacing="0.5" fill="#edf4ed">UM</text>
    <circle cx="48" cy="26" r="5" fill="#ef7157"/>
  </g>

  <text x="72" y="170" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" letter-spacing="3.4" fill="#8a9a90">TORONTO, CANADA</text>

  <text x="72" y="260" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="700" fill="#edf4ed">Hi, I'm Umang</text>

  <text x="72" y="320" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="32" font-weight="600" fill="#ef7157">Software Developer</text>

  <text x="72" y="380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#a5b4a8">I build software that's dependable, maintainable,</text>
  <text x="72" y="410" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#a5b4a8">and a little bit considered.</text>

  <g transform="translate(1000 320)">
    <circle cx="56" cy="56" r="56" fill="#c9f36a"/>
    <text x="56" y="66" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#23320f">UM</text>
  </g>
</svg>
